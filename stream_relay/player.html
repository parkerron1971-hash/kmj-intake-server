<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Service video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f0efec;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  video { display: block; width: 100%; height: 100%; background: #000; }
  #note { position: absolute; inset: 0; display: grid; place-items: center;
    padding: 16px; text-align: center; }
  #note[hidden] { display: none; }
</style>
</head>
<body>
<video id="v" controls playsinline preload="metadata"></video>
<p id="note" hidden></p>
<!-- The relay uploads this page to the root of the media bucket
     (stream_relay/agent/relay_agent.py). It plays only our own
     recordings: /live/<church>/<session>/index.m3u8 on this host. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"
        integrity="sha384-9v3HcdYrO3D+OPDTjZ40RXocgE4GtXVCd3/mCS62JsM93JXgI1afJVuwjFvsu6ni"
        crossorigin="anonymous"></script>
<script>
(function () {
  var video = document.getElementById('v');
  var note = document.getElementById('note');
  function say(text) { note.textContent = text; note.hidden = false; video.hidden = true; }
  var src = new URLSearchParams(location.search).get('v') || '';
  if (!/^\/live\/[0-9a-f-]{36}\/[0-9a-f-]{36}\/index\.m3u8$/.test(src)) {
    say("This video isn't available.");
    return;
  }
  if (window.Hls && Hls.isSupported()) {
    var hls = new Hls({ liveSyncDurationCount: 3, maxBufferLength: 30 });
    var tries = 0;
    hls.on(Hls.Events.ERROR, function (_e, data) {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR && tries < 3) { tries++; hls.recoverMediaError(); return; }
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR && tries < 20) {
        // A live service that dropped for a moment comes back: try again.
        tries++;
        setTimeout(function () { hls.loadSource(src); }, 3000);
        return;
      }
      say("The video stopped. Please refresh to try again.");
    });
    hls.on(Hls.Events.MANIFEST_PARSED, function () { tries = 0; });
    hls.loadSource(src);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src;   // Safari and iPhones play this natively
  } else {
    say("This browser can't play the video. Try another browser.");
  }
})();
</script>
</body>
</html>
