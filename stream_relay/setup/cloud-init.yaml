#cloud-config
# Paste this into DigitalOcean's "User data" box when creating the droplet
# (Ubuntu 24.04, Basic $6). It installs Docker, locks the firewall down to
# SSH + RTMP, and turns on automatic security updates. The relay itself is
# copied on afterwards with setup/deploy.sh.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - unattended-upgrades
write_files:
  # Security updates install themselves. If one needs a reboot, it happens
  # at 07:30 UTC (3:30am Eastern), hours before any service, and
  # Docker brings the relay back up on its own.
  - path: /etc/apt/apt.conf.d/52stream-relay
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "07:30";
runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 1935/tcp
  - ufw --force enable
  - systemctl enable --now docker
  - mkdir -p /opt/stream_relay /var/relay
  - chmod 700 /var/relay
