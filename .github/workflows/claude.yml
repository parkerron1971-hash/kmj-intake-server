# Chief → Claude Code bridge (2026-07-11).
# When Chief queues a build request, the backend opens an issue here
# tagged @claude. This workflow hands that issue to Claude Code running
# in GitHub's cloud: it implements the brief on a fresh branch and opens
# a PR. The owner's merge remains the only human step.
#
# Setup (one time, both repos):
#   1. Install the Claude GitHub App on this repo (github.com/apps/claude
#      — or run /install-github-app inside Claude Code).
#   2. Add repo secret ANTHROPIC_API_KEY.
# Manual use also works: comment "@claude <ask>" on any issue or PR.
name: Claude Code

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          # Kevin is on Claude Max — builds ride the subscription
          # (claude setup-token -> CLAUDE_CODE_OAUTH_TOKEN secret)
          # instead of metered API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Model comes from the repo variable CLAUDE_BUILD_MODEL —
          # settable live from Mission Control -> System Health ->
          # Builder (no code change to switch). Defaults to the top of
          # the line; the action's own beta default is retired (404s).
          model: ${{ vars.CLAUDE_BUILD_MODEL || 'claude-fable-5' }}
          # Self-verify + self-PR (2026-07-12, Kevin): the builder can
          # compile-check its work and open its own pull request.
          claude_env: |
            GH_TOKEN: ${{ github.token }}
          allowed_tools: "Bash(python -m py_compile:*),Bash(python -c:*),Bash(gh pr create:*),Bash(gh pr view:*)"
          custom_instructions: |
            MANDATORY FINISHING SEQUENCE (in order):
            1. SELF-CHECK before pushing: run
               `python -m py_compile <every .py file you changed>` and fix
               any syntax error before proceeding. Report the result in
               your comment.
            2. OPEN THE PULL REQUEST YOURSELF after pushing:
               `gh pr create --base main --title "..." --body "..."`
               with a body that explains the change and includes
               "Closes #<issue number>". Post the PR URL in your final
               comment. Never finish with only a create-PR link.
        env:
          GH_TOKEN: ${{ github.token }} 
