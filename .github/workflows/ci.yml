name: CI

permissions:
  contents: read

# Arc 29 — turns the 66-file pytest suite into a gate on every push/PR.
# Tests use in-memory fakes (no live Supabase/Stripe/Anthropic), so no
# secrets are needed in CI. Compile-checks the whole tree first so a
# syntax error fails fast before the suite runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A5 (2026-07-18) — the KMJ design acceptance harness is MANUAL-only:
  # it needs live Supabase/Anthropic/(Moonshot)/playwright and a dedicated
  # fixture business, so it can never ride the fake-based suite above.
  workflow_dispatch:
    inputs:
      fixture_business_id:
        description: "KMJ acceptance fixture business id (page gets overwritten). Leave empty to skip design acceptance."
        required: false
        default: ""
      modes:
        description: "anthropic,moonshot,fallback (or a subset)"
        default: "anthropic,moonshot,fallback"
      chief_eval:
        description: "Run the Chief turn eval against the real model (true/false)"
        required: false
        default: "false"
      chief_model_chat:
        description: "Optional CHIEF_MODEL_CHAT override for the eval run (e.g. a candidate model id)"
        required: false
        default: ""
      chief_case:
        description: "Optional authored action case ID for a targeted live retest; empty runs all action cases"
        required: false
        default: ""

jobs:
  # Chief turn eval, LIVE (2026-09-04): the golden set in
  # scripts/chief_turn_eval.py against the real model, verbs only. The
  # replay mode of the same set runs on every PR inside the `test` job
  # below with no key. This job is manual for the same reason
  # design-acceptance is: it spends money, and a pull_request trigger
  # would hand the key to a fork. Run it before adopting a new model:
  #   CHIEF_MODEL_CHAT=<candidate> on one run, the current lane on
  #   another, then --compare the two report artifacts.
  chief-eval-live:
    if: github.event_name == 'workflow_dispatch' && inputs.chief_eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the Chief turn eval against the real model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHIEF_MODEL_CHAT: ${{ inputs.chief_model_chat }}
          CHIEF_EVAL_CASE: ${{ inputs.chief_case }}
        run: |
          args=(--live --out chief-eval-report.json)
          if [[ -n "$CHIEF_EVAL_CASE" ]]; then args+=(--only "$CHIEF_EVAL_CASE"); fi
          python scripts/chief_turn_eval.py "${args[@]}"
      - name: Measure factual answers and unsupported claims
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHIEF_MODEL_CHAT: ${{ inputs.chief_model_chat }}
        run: python scripts/chief_factual_eval.py --live --out chief-factual-report.json
      - name: Measure advice answers (did it answer, commit, offer a next step)
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHIEF_MODEL_CHAT: ${{ inputs.chief_model_chat }}
        run: python scripts/chief_advice_eval.py --live --out chief-advice-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chief-eval-report
          path: |
            chief-eval-report.json
            chief-factual-report.json
            chief-advice-report.json

  design-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.fixture_business_id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (+ playwright chromium)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run the KMJ acceptance harness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ACCEPTANCE_BUSINESS_ID: ${{ inputs.fixture_business_id }}
        run: |
          python scripts/design_acceptance.py \
            --business-id "$ACCEPTANCE_BUSINESS_ID" \
            --modes "${{ inputs.modes }}" \
            --json acceptance-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-acceptance-report
          path: acceptance-report.json

  # The suite runs as four parts side by side (Kevin, 2026-11-13: agents were
  # waiting on each other's 20-minute runs to merge). scripts/shard_tests.py
  # gives each part its test files, each file in exactly one part, weighed by
  # its number of tests. The database checks run beside them. The job named
  # `test` below is the one the main branch's rule requires: it passes only
  # when every part and the database checks passed.
  test-part:
    name: test part ${{ matrix.part }} of 4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all modules (fast syntax gate)
        if: matrix.part == 1
        run: python -m compileall -q . -x '(\.bak|__pycache__)'

      - name: Run this part of the test suite
        # Controller fixtures use real Chromium with local route responses only.
        # No supplier, model or paid service is contacted.
        # 2026-11-28: four separate pytest processes, one per core, each on
        # its own slice of 16 (part k runs slices 4k-3..4k). Not -n auto:
        # xdist makes EVERY worker collect EVERY file of the part, and that
        # collecting was ~3.3 of this job's ~5.5 minutes. Each file still
        # runs whole in one process, its tests in order.
        run: |
          python scripts/shard_tests.py --check 4 16
          python -m playwright install --with-deps chromium
          k=${{ matrix.part }}
          pids=()
          for j in 1 2 3 4; do
            slice=$(( (k - 1) * 4 + j ))
            pytest -q -p no:cacheprovider --basetemp="$RUNNER_TEMP/pytest-tmp-$j" \
              $(python scripts/shard_tests.py $slice 16) --maxfail=10 --durations=5 \
              > "$RUNNER_TEMP/pytest-$j.log" 2>&1 &
            pids+=($!)
          done
          status=0
          for j in 1 2 3 4; do
            slice=$(( (k - 1) * 4 + j ))
            if wait "${pids[$((j - 1))]}"; then
              echo "::group::slice $slice of 16 passed: $(tail -n 1 "$RUNNER_TEMP/pytest-$j.log")"
              cat "$RUNNER_TEMP/pytest-$j.log"
              echo "::endgroup::"
            else
              status=1
              echo "::error title=pytest slice $slice of 16 failed::$(tail -n 1 "$RUNNER_TEMP/pytest-$j.log")"
              cat "$RUNNER_TEMP/pytest-$j.log"
            fi
          done
          exit $status

      - name: Chief computer sabotage check
        if: matrix.part == 1
        run: python scripts/chief_computer_sabotage.py

  # The database checks (PGlite): every scripts/*-db-check.mjs and every
  # __tests__/*_db.mjs, FOUND by scripts/db_checks.mjs (2026-11-28; no list to
  # keep here: a new check runs the moment its file exists). Two parts, each
  # running its checks one per core; scripts/db_checks.json weighs them by
  # measured seconds and names the few that must not run. Each check runs in
  # its own process through scripts/db_check_child.mjs, which closes the
  # PGlite a check left open, so node no longer waits ~10 s after each one.
  # Was ~19 minutes one after another; see worklog/2026-11-28-faster-ci.md.
  test-db:
    name: test database checks part ${{ matrix.part }} of 2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: PGlite from the cache
        id: pglite
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pglite
          key: pglite-0.5.8-${{ runner.os }}

      - name: Install PGlite
        if: steps.pglite.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts --no-package-lock --prefix "$RUNNER_TEMP/pglite" @electric-sql/pglite@0.5.8

      - name: Run this part of the database checks
        env:
          PGLITE_MODULE: ${{ runner.temp }}/pglite/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node scripts/db_checks.mjs --check ${{ strategy.job-total }}
          node scripts/db_checks.mjs --run ${{ matrix.part }} ${{ strategy.job-total }}

  # The check the main branch's rule requires. It waits for every part and
  # the database checks, and passes only when all of them passed: a part
  # that failed, was cancelled or never ran fails it.
  test:
    needs: [test-part, test-db]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part and the database checks passed
        run: |
          echo "test parts: ${{ needs.test-part.result }} · database checks: ${{ needs.test-db.result }}"
          test "${{ needs.test-part.result }}" = "success"
          test "${{ needs.test-db.result }}" = "success"
