name: Restore drill

# scripts/restore_drill.py already existed and was already right. It was
# scheduled by nothing, which is the same as not existing: a rehearsal
# that depends on somebody remembering is a rehearsal that stops
# happening, and you find that out on the day you need it.
#
# WHAT IT PROVES, and what it deliberately does not.
#
# It copies the tables whose loss would end the business into an isolated
# `restore_drill` schema, compares row counts, then reports what a
# data-only recovery leaves behind. On this database, today, that is 316
# RLS policies, 544 indexes and 358 constraints. The number matters: it
# is the difference between "we restored the data" and "we stood up every
# customer's records with row-level security switched off".
#
# It never calls POST /v1/projects/{ref}/restore. That endpoint restores
# IN PLACE, over the live database, with no dry-run and no undo.
# Rehearsing a restore by performing one on production is not a
# rehearsal. A real pg_restore of the physical backup DOES bring policies
# and indexes across; what this proves is that the manual shortcut
# somebody reaches for under pressure is not equivalent to it.
#
# It writes to production — an isolated schema, dropped on the way in and
# on the way out. Monthly, off-hours, and cheap at this size (~90 MB).

on:
  schedule:
    - cron: "20 8 1 * *"       # 08:20 UTC on the 1st
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rehearse the recovery
        id: drill
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set — the drill cannot run."
            exit 1
          fi
          python scripts/restore_drill.py | tee drill.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Restore drill"
            echo ""
            echo '```'
            cat drill.txt 2>/dev/null || echo "(the drill produced no output)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Raise the alarm
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '(no output captured)';
            try { out = fs.readFileSync('drill.txt', 'utf8').slice(0, 4000); } catch (e) {}
            const body = [
              'The monthly restore drill failed.',
              '',
              'Either row counts no longer match after a restore, or the drill',
              'could not clean up its schema. Both mean the recovery path is',
              'not currently trustworthy.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```',
              out,
              '```',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'restore-drill-failure',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Restore drill FAILED', body,
                labels: ['restore-drill-failure'],
              });
            }
